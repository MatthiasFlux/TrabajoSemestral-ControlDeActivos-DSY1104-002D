<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre Central - Control de Activos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="form-body">

<!-- Login / Registro -->
<section id="vistaAuth" class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="auth-card p-4 shadow-lg rounded bg-white">
        <div id="boxLogin">
            <div class="text-center mb-3">
                <img src="https://picsum.photos/id/1076/60/60" alt="Logo Torre Central" class="rounded mb-2">
                <h4 class="fw-bold m-0">Torre Central</h4>
                <p class="text-muted small">Sistema de Control de Activos e Infraestructura</p>
            </div>
            
            <form id="formLogin">
                <div class="mb-3">
                    <label for="loginCorreo" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control btn-lg-touch" id="loginCorreo" placeholder="admin@torrecentral.cl" required>
                </div>
                <div class="mb-3">
                    <label for="loginPass" class="form-label">Contraseña</label>
                    <input type="password" class="form-control btn-lg-touch" id="loginPass" placeholder="••••••••" required>
                </div>
                <div id="msgLogin" class="mensaje"></div>
                <button type="submit" class="btn btn-celeste w-100 py-3 mb-3 btn-lg-touch fs-5">Ingresar al Sistema</button>
            </form>

            <div class="text-center small mb-3">
                <span>¿No tienes una cuenta? </span>
                <a href="#" class="text-decoration-none fw-bold" onclick="toggleAuthForms(true)">Regístrate aquí</a>
            </div>

            <div class="card bg-light border-0 p-3 text-start small">
                <div class="fw-bold mb-1 text-secondary">🔑 Selector de Rol para Pruebas:</div>
                <div class="d-grid gap-1">
                    <button class="btn btn-outline-dark btn-sm text-start py-1" onclick="cargarCredenciales('jefe@torrecentral.cl', '123456')">
                        <strong>Administrador:</strong> admin@torrecentral.cl
                    </button>
                    <button class="btn btn-outline-dark btn-sm text-start py-1" onclick="cargarCredenciales('jefe@torrecentral.cl', '123456')">
                        <strong>Jefe Mantenimiento:</strong> jefe@torrecentral.cl
                    </button>
                    <button class="btn btn-outline-dark btn-sm text-start py-1" onclick="cargarCredenciales('jefe@torrecentral.cl', '123456')">
                        <strong>Técnico:</strong> tecnico@torrecentral.cl
                    </button>
                    <button class="btn btn-outline-dark btn-sm text-start py-1" onclick="cargarCredenciales('jefe@torrecentral.cl', '123456')">
                        <strong>Encargado Activos:</strong> activos@torrecentral.cl
                    </button>
                    <button class="btn btn-outline-dark btn-sm text-start py-1" onclick="cargarCredenciales('arrendatario@torrecentral.cl', '123456')">
                        <strong>Arrendatario:</strong> arrendatario@torrecentral.cl
                    </button>
                </div>
            </div>
        </div>

        <div id="boxRegistro" class="d-none">
            <div class="text-center mb-4">
                <h4 class="fw-bold">Crear Cuenta</h4>
            </div>
            <form id="formRegistro">
                <div class="mb-3">
                    <label for="regNombre" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control btn-lg-touch" id="regNombre" required>
                </div>
                <div class="mb-3">
                    <label for="regCorreo" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control btn-lg-touch" id="regCorreo" required>
                </div>
                <div class="mb-3">
                    <label for="regRol" class="form-label">Rol en el Edificio</label>
                    <select id="regRol" class="form-select btn-lg-touch" required>
                        <option value="Arrendatario">Arrendatario</option>
                        <option value="Técnico de Mantenimiento">Técnico de Mantenimiento</option>
                        <option value="Jefe de Mantenimiento">Jefe de Mantenimiento</option>
                        <option value="Encargado de Activos">Encargado de Activos</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="regPass" class="form-label">Contraseña</label>
                    <input type="password" class="form-control btn-lg-touch" id="regPass" required>
                </div>
                <div id="msgRegistro" class="mensaje"></div>
                <button type="submit" class="btn btn-celeste w-100 py-3 mb-3 btn-lg-touch fs-5">Registrar Cuenta</button>
            </form>
            <div class="text-center small">
                <a href="#" class="text-decoration-none fw-bold" onclick="toggleAuthForms(false)">Volver al Login</a>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="validaciones.js"></script>
</body>
</html>
